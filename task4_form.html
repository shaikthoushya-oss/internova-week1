<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form action="#" method="post">
        <fieldset>
            <legend>Personal Details</legend>

            <p>
                <label for="name">Full Name:</label><br>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </p>
            <p>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </p>
            <p>
                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10-digit number" required>
            </p>
            <p>
                Gender:<br>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
            </p>
            <p>
                <label for="dob">Date of Birth:</label><br>
                <input type="date" id="dob" name="dob" required>
            </p>
        </fieldset>

        <fieldset>
            <legend>Course Details</legend>

            <p>
                <label for="course">Select Course:</label><br>
                <select id="course" name="course" required>
                    <option value="">-- Choose a course --</option>
                    <option value="web">Web Development</option>
                    <option value="java">Java Programming</option>
                    <option value="python">Python</option>
                    <option value="data">Data Analytics</option>
                </select>
            </p>
            <p>
                Interests:<br>
                <input type="checkbox" id="frontend" name="interest" value="frontend">
                <label for="frontend">Frontend</label>
                <input type="checkbox" id="backend" name="interest" value="backend">
                <label for="backend">Backend</label>
                <input type="checkbox" id="database" name="interest" value="database">
                <label for="database">Database</label>
            </p>
            <p>
                <label for="address">Address:</label><br>
                <textarea id="address" name="address" rows="4" cols="40" placeholder="Enter your address"></textarea>
            </p>
            <p>
                <input type="checkbox" id="agree" name="agree" required>
                <label for="agree">I agree to the terms and conditions</label>
            </p>
        </fieldset>

        <p>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </p>
    </form>
</body>
</html>
